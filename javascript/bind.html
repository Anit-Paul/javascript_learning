<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bind</title>
</head>
<body>
    <button>click</button>
</body>
<script>
    class React{
        constructor(){
            this.server="www.google.com";
            this.method="post";

            //requirement
            document.querySelector("button").addEventListener("click",this.handleClick.bind(this));
        }

        handleClick(){
            console.log("clicked");
            console.log(this.server);
            console.log(this.method);
        }
    };

    const app=new React();
    
</script>
</html>
